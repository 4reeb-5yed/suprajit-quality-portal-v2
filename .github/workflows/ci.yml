name: Ultimate Test & Build Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-source:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-limiter flask-login flask-mail flask-wtf python-dotenv waitress apscheduler
        pip install pytest pytest-flask pytest-cov
    - name: Run Mathematical Source Code Tests
      env:
        PYTHONPATH: .
      run: |
        python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"
        python -m pytest tests/ -v --cov=app --cov-report=term

  build-and-smoke-test:
    needs: test-source
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-limiter flask-login flask-mail flask-wtf python-dotenv waitress apscheduler
        pip install pyinstaller pytest pytest-flask
    - name: Compile Executable
      run: |
        copy .env.example .env
        pyinstaller SuprajitQualityPortal.spec --noconfirm
    - name: Run Compiled EXE Smoke Test
      run: |
        python tests/smoke_test_binary.py


