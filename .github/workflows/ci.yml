name: Suprajit Quality Portal Enterprise CI & Security Quality Gate

on:
  push:
    branches: [ "master", "v3" ]
  pull_request:
    branches: [ "master", "v3" ]

permissions:
  contents: read

jobs:
  static-analysis-and-security:
    name: Static Analysis & Security Gate
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Analysis Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit ruff mypy pip-audit

    - name: 1. Run Bandit Security Scanner
      run: |
        python -m bandit -r app/ -lll

    - name: 2. Run Ruff Lint & Format Check
      run: |
        python -m ruff check app/
        python -m ruff format --check app/

    - name: 3. Run Mypy Type Checker
      run: |
        python -m mypy app/ --ignore-missing-imports

    - name: 4. Run Pip-Audit Dependency CVE Scanner
      run: |
        python -m pip_audit

    - uses: gitleaks/gitleaks-action@v2
      name: 5. Run Gitleaks Secret Scanner
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-matrix:
    name: Full Test Suite & E2E Validation
    needs: static-analysis-and-security
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Project & Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip install playwright pytest-playwright openpyxl
        python -m playwright install chromium

    - name: Run Full Test Suite with Coverage
      env:
        PYTHONPATH: .
        SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      run: |
        python -m pytest -c pytest.ini tests/ -v --cov=app --cov-branch --cov-report=term
