name: Ultimate Test & Build Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-source:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-limiter flask-login flask-mail flask-wtf python-dotenv waitress openpyxl apscheduler
        pip install pytest pytest-flask pytest-cov
    - name: Run Mathematical Source Code Tests
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_ultimate.py tests/test_sync_engine_dimensions.py -v --cov=app --cov-report=term

  build-and-smoke-test:
    needs: test-source
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-limiter flask-login flask-mail flask-wtf python-dotenv waitress openpyxl apscheduler
        pip install pyinstaller pytest pytest-flask
    - name: Compile Executable
      run: |
        copy .env.example .env
        pyinstaller SuprajitQualityPortal.spec --noconfirm
    - name: Run Compiled EXE Smoke Test
      run: |
        python tests/test_compiled_binary.py
