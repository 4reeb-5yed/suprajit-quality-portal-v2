name: Ultimate Test & Build Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  test-source:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip install pytest pytest-flask pytest-cov
    - name: Software Composition Analysis (pip-audit)
      run: |
        pip install pip-audit
        pip-audit

    - name: Run Mathematical Source Code Tests
      env:
        PYTHONPATH: .
      run: |
        python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"
        python -m pytest tests/ -v --cov=app --cov-report=term

  build-and-smoke-test:
    needs: test-source
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller pytest pytest-flask
    - name: Compile Executable
      run: |
        copy .env.example .env
        pyinstaller SuprajitQualityPortal.spec --noconfirm
    - name: Run Compiled EXE Smoke Test
      run: |
        python tests/smoke_test_binary.py


    - name: Zip Executable
      run: |
        Compress-Archive -Path dist\SuprajitQualityPortal -DestinationPath SuprajitQualityPortal_V2.zip -Force
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        files: SuprajitQualityPortal_V2.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




