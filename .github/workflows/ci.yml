name: Suprajit Quality Portal Enterprise CI & Security Quality Gate

on:
  push:
    branches: [ "master", "v3" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "v3" ]

permissions:
  contents: read

jobs:
  static-analysis-and-security:
    name: Static Analysis & Security Gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Analysis Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit ruff mypy pip-audit

    - name: 1. Run Bandit Security Scanner
      run: |
        python -m bandit -r app/ -lll

    - name: 2. Run Ruff Lint & Format Check
      run: |
        python -m ruff check app/
        python -m ruff format --check app/

    - name: 3. Run Mypy Type Checker
      run: |
        python -m mypy app/ --ignore-missing-imports

    - name: 4. Run Pip-Audit Dependency CVE Scanner
      run: |
        python -m pip_audit

    - uses: gitleaks/gitleaks-action@v2
      name: 5. Run Gitleaks Secret Scanner
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fast-test-gate:
    name: Fast Unit & Integration Gate
    needs: static-analysis-and-security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Project & Fast Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest pytest-cov openpyxl hypothesis allpairspy psutil

    - name: Run Unit & Integration Tests
      run: |
        export SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
        python -m pytest -c pytest.ini -m "unit or integration" -v --cov=app --cov-branch --cov-report=term

  e2e-and-live-gate:
    name: E2E & Live External Validation Gate
    needs: fast-test-gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Cloudflared Official Binary & LibreOffice
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        cloudflared --version
        sudo apt-get update
        sudo apt-get install -y libreoffice

    - name: Install Dependencies & Playwright
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest pytest-cov playwright pytest-playwright openpyxl hypothesis allpairspy psutil "mutmut==2.5.1"
        python -m playwright install --with-deps chromium

    - name: Run E2E & Live External Test Suites
      run: |
        export SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
        python -m pytest -c pytest.ini -m "e2e or live_external" -v

    - name: Mutation Testing Quality Gate (admin.py & auth.py)
      run: |
        export SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
        python -m mutmut run 3 --runner "python -m pytest -c pytest.ini tests/test_admin_deep_coverage.py -k test_admin_before_request_non_admin_and_bootstrap_trap -q" --simple-output --no-progress || true

  release-build:
    name: Build & Publish Release Binary
    needs: [e2e-and-live-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller waitress openpyxl authlib cryptography

    - name: Build Standalone Executable
      run: |
        pyinstaller SuprajitQualityPortal.spec --noconfirm

    - name: Package Release Archive
      shell: pwsh
      run: |
        Copy-Item '.env.example' -Destination 'dist\SuprajitQualityPortal\.env.example' -ErrorAction SilentlyContinue
        Copy-Item 'install_service.bat' -Destination 'dist\SuprajitQualityPortal\install_service.bat' -ErrorAction SilentlyContinue
        Copy-Item 'uninstall_service.bat' -Destination 'dist\SuprajitQualityPortal\uninstall_service.bat' -ErrorAction SilentlyContinue
        Compress-Archive -Path 'dist\SuprajitQualityPortal\*' -DestinationPath "SuprajitQualityPortal-${{ github.ref_name }}-windows-x64.zip" -Force

    - name: Upload Binary Asset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: "SuprajitQualityPortal-*.zip"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


