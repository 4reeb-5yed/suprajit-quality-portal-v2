name: Suprajit Quality Portal Enterprise CI Matrix

on:
  push:
    branches: [ "master", "v3" ]
  pull_request:
    branches: [ "master", "v3" ]

permissions:
  contents: write

jobs:
  test-source:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip install pytest pytest-flask pytest-cov
    - name: Run Complete 3-Way Test Matrix (Unit, Integration, ASVS Security & E2E)
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v --cov=app --cov-report=term

  build-and-smoke-test:
    needs: test-source
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller pytest pytest-flask
    - name: Compile Executable
      run: |
        copy .env.example .env
        pyinstaller SuprajitQualityPortal.spec --noconfirm
    - name: Run Compiled EXE Smoke Test
      run: |
        python tests/smoke_test_binary.py
