<!-- 4. Enterprise Single Sign-On (SSO / OAuth 2.0) Configuration -->
<div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
    <div class="p-5 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
        <div>
            <h2 class="text-base font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-key text-blue-600"></i>
                Single Sign-On (SSO / OAuth 2.0) Configuration
            </h2>
            <p class="text-xs text-gray-500 mt-1">Enable one-click corporate login via Microsoft (Office 365), Google Workspace, or GitHub.</p>
        </div>
    </div>
    <div class="p-6">
        <form id="ssoForm" method="POST" action="{{ url_for('admin.settings') }}" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Microsoft / Outlook -->
                <div class="border border-gray-200 rounded p-4 bg-gray-50 space-y-3 flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between pb-2 border-b border-gray-200">
                            <span class="font-bold text-sm text-gray-800 flex items-center gap-2">
                                <i class="fa-brands fa-microsoft text-blue-500 text-lg"></i> Microsoft 365 / Outlook
                            </span>
                            <input type="checkbox" name="sso_microsoft_enabled" value="1" class="toggle toggle-primary toggle-sm" {% if oauth_settings.get('sso_microsoft_enabled') == '1' %}checked{% endif %} />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">Client ID (App ID)</span></label>
                            <input type="text" name="sso_microsoft_client_id" value="{{ oauth_settings.get('sso_microsoft_client_id', '') }}" placeholder="e.g. 7a8b9c..." class="input input-sm input-bordered w-full font-mono text-xs" />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">Client Secret</span></label>
                            <input type="password" name="sso_microsoft_client_secret" value="{{ oauth_settings.get('sso_microsoft_client_secret', '') }}" placeholder="Secret Value" class="input input-sm input-bordered w-full text-xs" />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">Directory (Tenant) ID</span></label>
                            <input type="text" name="sso_microsoft_tenant_id" value="{{ oauth_settings.get('sso_microsoft_tenant_id', '') }}" placeholder="common or tenant-id" class="input input-sm input-bordered w-full font-mono text-xs" />
                        </div>
                    </div>
                    <div class="text-[11px] text-gray-400">Callback: <code>/oauth/callback/microsoft</code></div>
                </div>

                <!-- Google Workspace -->
                <div class="border border-gray-200 rounded p-4 bg-gray-50 space-y-3 flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between pb-2 border-b border-gray-200">
                            <span class="font-bold text-sm text-gray-800 flex items-center gap-2">
                                <i class="fa-brands fa-google text-red-500 text-lg"></i> Google Workspace
                            </span>
                            <input type="checkbox" name="sso_google_enabled" value="1" class="toggle toggle-primary toggle-sm" {% if oauth_settings.get('sso_google_enabled') == '1' %}checked{% endif %} />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">OAuth Client ID</span></label>
                            <input type="text" name="sso_google_client_id" value="{{ oauth_settings.get('sso_google_client_id', '') }}" placeholder="e.g. 123...apps.googleusercontent.com" class="input input-sm input-bordered w-full font-mono text-xs" />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">OAuth Client Secret</span></label>
                            <input type="password" name="sso_google_client_secret" value="{{ oauth_settings.get('sso_google_client_secret', '') }}" placeholder="Client Secret" class="input input-sm input-bordered w-full text-xs" />
                        </div>
                    </div>
                    <div class="text-[11px] text-gray-400">Callback: <code>/oauth/callback/google</code></div>
                </div>

                <!-- GitHub -->
                <div class="border border-gray-200 rounded p-4 bg-gray-50 space-y-3 flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between pb-2 border-b border-gray-200">
                            <span class="font-bold text-sm text-gray-800 flex items-center gap-2">
                                <i class="fa-brands fa-github text-gray-900 text-lg"></i> GitHub
                            </span>
                            <input type="checkbox" name="sso_github_enabled" value="1" class="toggle toggle-primary toggle-sm" {% if oauth_settings.get('sso_github_enabled') == '1' %}checked{% endif %} />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">OAuth Client ID</span></label>
                            <input type="text" name="sso_github_client_id" value="{{ oauth_settings.get('sso_github_client_id', '') }}" placeholder="e.g. Iv1.8..." class="input input-sm input-bordered w-full font-mono text-xs" />
                        </div>
                        <div class="form-control">
                            <label class="label py-0.5"><span class="label-text text-xs font-semibold text-gray-600">OAuth Client Secret</span></label>
                            <input type="password" name="sso_github_client_secret" value="{{ oauth_settings.get('sso_github_client_secret', '') }}" placeholder="Client Secret" class="input input-sm input-bordered w-full text-xs" />
                        </div>
                    </div>
                    <div class="text-[11px] text-gray-400">Callback: <code>/oauth/callback/github</code></div>
                </div>
            </div>
        </form>
    </div>
    <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-end">
        <button type="submit" form="ssoForm" class="btn btn-primary suprajit-blue-bg border-none text-white font-bold text-xs px-4 shadow">
            <i class="fa-solid fa-save mr-1.5"></i> Save SSO Settings
        </button>
    </div>
</div>
