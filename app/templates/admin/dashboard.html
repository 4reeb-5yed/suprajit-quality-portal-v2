{% extends "base.html" %}

{% block content %}
<div class="space-y-8">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-800"><i class="fa-solid fa-chart-pie text-blue-800 mr-2"></i>Executive Quality Dashboard</h1>
            <p class="text-sm text-gray-500 mt-1">High-level factory throughput, customer metrics, and recent automated batch status.</p>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white border border-gray-200 rounded shadow-sm p-6 flex items-center justify-between">
            <div>
                <h2 class="text-gray-500 font-semibold uppercase tracking-wider text-xs">Total Reports</h2>
                <div class="text-4xl font-bold text-blue-900 mt-2">{{ reports_count }}</div>
            </div>
            <i class="fa-solid fa-file-excel text-5xl text-blue-100"></i>
        </div>
        <div class="bg-white border border-gray-200 rounded shadow-sm p-6 flex items-center justify-between">
            <div>
                <h2 class="text-gray-500 font-semibold uppercase tracking-wider text-xs">Active Users</h2>
                <div class="text-4xl font-bold text-blue-900 mt-2">{{ users_count }}</div>
            </div>
            <i class="fa-solid fa-users text-5xl text-blue-100"></i>
        </div>
        <div class="bg-white border border-gray-200 rounded shadow-sm p-6 flex items-center justify-between">
            <div>
                <h2 class="text-gray-500 font-semibold uppercase tracking-wider text-xs">Customers</h2>
                <div class="text-4xl font-bold text-blue-900 mt-2">{{ customers_count }}</div>
            </div>
            <i class="fa-solid fa-building text-5xl text-blue-100"></i>
        </div>
    </div>
</div>
{% endblock %}
