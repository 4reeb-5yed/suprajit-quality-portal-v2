{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="max-w-md w-full bg-white rounded shadow-lg p-8 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold text-gray-800 mb-2"><i class="fa-solid fa-shield-halved text-blue-600 mr-2"></i>First-Boot Setup</h2>
        <p class="text-sm text-gray-600 mb-6">For your security, you must immediately change the default bootstrap password before accessing the system.</p>
        
        <form method="POST" action="{{ url_for('admin.setup') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-bold text-gray-700">New Administrator Password</span></label>
                <input type="password" name="new_password" required minlength="8" class="input input-bordered w-full" placeholder="At least 8 characters" />
            </div>
            
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-bold text-gray-700">Canspirit Developer Email</span></label>
                <input type="email" name="developer_email" required class="input input-bordered w-full" placeholder="admin@canspirit.com" />
                <label class="label"><span class="label-text-alt text-gray-500">Telemetry logs will be sent here.</span></label>
            </div>
            
            <button type="submit" class="btn btn-primary suprajit-blue-bg border-none text-white w-full mt-4">
                Secure System & Continue
            </button>
        </form>
    </div>
</div>
{% endblock %}
