{% if reports %}
    {% for row in reports %}
    <tr>
        <td class="font-mono font-semibold text-blue-800 bg-blue-50/50 px-4">{{ row.serial_normalized }}</td>
        <td class="font-medium text-gray-800">{{ row.recipe_name }}</td>
        <td class="text-gray-600 font-mono text-sm">{{ row.report_date }}</td>
        <td class="text-gray-600 font-mono text-sm">{{ row.report_time }}</td>
        <td class="text-right">
            <a href="{{ url_for('portal.download_report', report_id=row.id) }}" class="btn btn-sm btn-outline btn-primary text-blue-700">
                <i class="fa-solid fa-download mr-1"></i> Download
            </a>
        </td>
    </tr>
    {% endfor %}
{% else %}
    <tr>
        <td colspan="5" class="p-8 text-center text-gray-500">
            <p class="font-medium">No quality reports found.</p>
        </td>
    </tr>
{% endif %}
