{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white border border-gray-200 rounded shadow-md p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold suprajit-blue-text">Forgot Password</h1>
            <p class="text-sm text-gray-500 mt-1">Enter your email to receive a secure reset link.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">Email Address</span></label>
                <input type="email" name="email" required class="input input-bordered w-full" />
            </div>
            
            <div class="mt-6">
                <button type="submit" class="btn w-full suprajit-blue-bg border-none text-white hover:bg-blue-900">Send Reset Link</button>
            </div>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-sm text-blue-600 hover:underline font-medium">Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
