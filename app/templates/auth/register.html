{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 mb-12">
    <div class="bg-white border border-gray-200 rounded shadow-md p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold suprajit-blue-text">Join Organization Portal</h1>
            <p class="text-sm text-gray-500 mt-1">Sign up with your approved company email address to gain instant access.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-control">
                <label class="label py-1"><span class="label-text font-semibold text-xs text-gray-700">Corporate Email Address</span></label>
                <input type="email" id="regEmail" name="email" placeholder="e.g. yourname@company.com" required class="input input-sm input-bordered w-full" oninput="autoSuggestRegUsername()" />
                <label class="label py-0.5"><span class="label-text-alt text-gray-400 text-[11px]">Must be your official organization email domain.</span></label>
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-semibold text-xs text-gray-700">Full Name</span></label>
                <input type="text" id="regDisplayName" name="display_name" placeholder="e.g. Rahul Sharma" required class="input input-sm input-bordered w-full" />
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-semibold text-xs text-gray-700">Desired Username</span></label>
                <input type="text" id="regUsername" name="username" placeholder="e.g. rahul_s" required class="input input-sm input-bordered w-full font-mono" />
                <label class="label py-0.5"><span class="label-text-alt text-gray-400 text-[11px]">Your company code prefix will be attached automatically.</span></label>
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-semibold text-xs text-gray-700">Password</span></label>
                <input type="password" name="password" required class="input input-sm input-bordered w-full" placeholder="Min 8 chars, 1 uppercase, 1 special" />
            </div>
            
            <div class="mt-6">
                <button type="submit" class="btn btn-primary w-full suprajit-blue-bg border-none text-white font-bold">Create Account</button>
            </div>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-xs text-blue-600 hover:underline font-medium">Already have an account? Sign in</a>
            </div>
        </form>
    </div>
</div>

<script>
function autoSuggestRegUsername() {
    const emailInput = document.getElementById('regEmail');
    const usernameInput = document.getElementById('regUsername');
    const nameInput = document.getElementById('regDisplayName');
    
    if (!emailInput || !usernameInput) return;
    const email = emailInput.value.trim();
    if (email.includes('@')) {
        const parts = email.split('@');
        const localPart = parts[0].toLowerCase().replace(/[^a-z0-9_-]/g, '_');
        if (localPart && !usernameInput.value) {
            usernameInput.value = localPart;
        }
        if (nameInput && !nameInput.value && localPart) {
            nameInput.value = localPart.replace(/[._-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }
    }
}
</script>
{% endblock %}
