{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white border border-gray-200 rounded shadow-md p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold suprajit-blue-text">Set New Password</h1>
            <p class="text-sm text-gray-500 mt-1">Please enter your new secure password.</p>
        </div>
        
        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="form-control">
                <label class="label"><span class="label-text font-semibold">New Password</span></label>
                <input type="password" name="password" required class="input input-bordered w-full" />
            </div>
            
            <div class="mt-6">
                <button type="submit" class="btn w-full suprajit-blue-bg border-none text-white hover:bg-blue-900">Update Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
