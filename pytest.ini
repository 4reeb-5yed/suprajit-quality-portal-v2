[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = .* build dist .venv app/static node_modules scratch
addopts = -ra -q -c pytest.ini
markers =
    unit: Pure function tests, no Flask app context, no database
    integration: Integration tests with Flask test client and real SQLite DB
    e2e: End-to-end browser journeys using Playwright
    live_external: Live integration tests with real SMTP sockets, real OIDC servers, or live cloudflared subprocesses

