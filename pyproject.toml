[project]
name = "suprajit-v2"
version = "0.1.0"
description = "Industrial Quality Control Data Portal"
readme = "README.md"
authors = [
    { name = "4reeb-5yed", email = "4reeb-5yed@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-wtf>=1.3.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.2.3",
    "waitress>=3.0.2",
    "authlib>=1.7.0",
    "requests>=2.31.0",
]

[project.scripts]
suprajit-v2 = "suprajit_v2:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.100.0",
    "allpairspy>=2.5.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.5.0",
    "openpyxl>=3.1.0",
    "bandit>=1.7.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".*", "build", "dist", ".venv", "app/static", "node_modules", "scratch"]
addopts = "-ra -q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E402", "W291", "W293"]


